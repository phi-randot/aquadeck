name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AquaDeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AquaDeck-apk
          path: AquaDeck.apk
      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AquaDeck build ${{ github.run_number }}
          files: AquaDeck.apk
      - name: Upload to Appetize (optional)
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
          APPETIZE_KEY: ${{ vars.APPETIZE_KEY }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then echo "No APPETIZE_TOKEN secret, skipping."; exit 0; fi
          URL=https://api.appetize.io/v1/apps
          if [ -n "$APPETIZE_KEY" ]; then URL="$URL/$APPETIZE_KEY"; fi
          curl -sS -X POST "$URL" -H "X-API-KEY: $APPETIZE_TOKEN" \
            -F "file=@AquaDeck.apk" -F "platform=android" -F "note=AquaDeck build ${{ github.run_number }}" -o appetize.json
          KEY=$(python3 -c "import json;print(json.load(open('appetize.json')).get('publicKey',''))")
          if [ -z "$KEY" ]; then echo "Appetize upload failed:"; cat appetize.json; exit 1; fi
          echo "## ▶ Run AquaDeck in your browser" >> $GITHUB_STEP_SUMMARY
          echo "https://appetize.io/app/$KEY" >> $GITHUB_STEP_SUMMARY
          echo "Appetize app: https://appetize.io/app/$KEY"
